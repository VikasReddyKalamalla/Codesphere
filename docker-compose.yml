version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: codesphere-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootpassword}
      MONGO_INITDB_DATABASE: codesphere
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codesphere-network

  # Redis Cache & Real-time Sync
  redis:
    image: redis:7-alpine
    container_name: codesphere-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codesphere-network

  # Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: codesphere-server
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      MONGO_URI: mongodb://root:${MONGO_ROOT_PASSWORD:-rootpassword}@mongodb:27017/codesphere?authSource=admin
      REDIS_URL: redis://default:${REDIS_PASSWORD:-redispassword}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_secret_key_change_in_production}
      JUDGE0_API_URL: ${JUDGE0_API_URL:-https://judge0-ce.p.rapidapi.com}
      JUDGE0_API_KEY: ${JUDGE0_API_KEY:-}
      JUDGE0_HOST: ${JUDGE0_HOST:-judge0-ce.p.rapidapi.com}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules
      - server_uploads:/app/uploads
    networks:
      - codesphere-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {if (r.statusCode !== 200) process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Frontend (Development only)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: codesphere-client
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
      VITE_SOCKET_URL: http://localhost:5000
      VITE_APP_NAME: CodeSphere
      VITE_ENVIRONMENT: ${NODE_ENV:-development}
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - codesphere-network
    depends_on:
      - server
    restart: unless-stopped
    profiles:
      - dev  # Only start with: docker-compose --profile dev up

  # Nginx Reverse Proxy (for production-like environment)
  nginx:
    image: nginx:alpine
    container_name: codesphere-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - server
    networks:
      - codesphere-network
    restart: unless-stopped
    profiles:
      - production  # Only start with: docker-compose --profile production up

  # Rocket.Chat Engine
  rocketchat:
    image: registry.rocket.chat/rocketchat/rocket.chat:latest
    container_name: codesphere-rocketchat
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - ROOT_URL=${ROCKETCHAT_URL:-http://localhost:3000}
      - PORT=3000
      - MONGO_URL=mongodb://rocketchat-db:27017/rocketchat?replicaSet=rs0
      - MONGO_OPLOG_URL=mongodb://rocketchat-db:27017/local?replicaSet=rs0
      - OVERWRITE_SETTING_Iframe_Restrict_Access=false
      - OVERWRITE_SETTING_Iframe_X_Frame_Options=*
      - DISABLE_X_FRAME=true
    depends_on:
      rocketchat-db:
        condition: service_healthy
    networks:
      - codesphere-network

  # MongoDB Replica Set Primary for Rocket.Chat
  rocketchat-db:
    image: mongo:8.0
    container_name: codesphere-rocketchat-db
    restart: unless-stopped
    volumes:
      - rocketchat_mongodb_data:/data/db
    command: mongod --oplogSize 128 --replSet rs0
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'try { rs.status() } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"localhost:27017\"}]}) }'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codesphere-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
  server_uploads:
    driver: local
  rocketchat_mongodb_data:
    driver: local

networks:
  codesphere-network:
    driver: bridge
