<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeSphere — Cloud Workspace & Developer Platform</title>
    <meta name="description" content="CodeSphere is an interactive cloud workspace, DSA practice environment, and web IDE for developers." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #030712;
        color: #f8fafc;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
    <script>
      window.__codesphere_init_error = null;

      function renderFatalError(err) {
        var root = document.getElementById('root');
        if (!root) return;
        var errStr = (err && (err.stack || err.message)) ? (err.stack || err.message) : String(err);
        root.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#030712;color:#f8fafc;padding:24px;font-family:monospace;text-align:center;">' +
          '<div style="max-width:540px;background:#0f172a;border:1px solid #dc2626;border-radius:12px;padding:24px;box-shadow:0 10px 25px rgba(0,0,0,0.5);">' +
          '<h2 style="color:#ef4444;font-size:18px;margin-bottom:12px;font-weight:bold;">CodeSphere Startup Error</h2>' +
          '<p style="font-size:12px;color:#94a3b8;margin-bottom:16px;">The application encountered a problem during startup:</p>' +
          '<pre style="font-size:11px;background:#1e293b;padding:12px;border-radius:8px;color:#fca5a5;overflow-x:auto;text-align:left;max-height:180px;white-space:pre-wrap;">' +
          errStr.replace(/</g, '&lt;').replace(/>/g, '&gt;') +
          '</pre>' +
          '<div style="margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">' +
          '<button onclick="localStorage.clear();sessionStorage.clear();window.location.reload();" style="padding:10px 18px;background:#04AA6D;color:white;border:none;border-radius:8px;font-size:13px;font-weight:bold;cursor:pointer;">Clear Storage & Reload</button>' +
          '<button onclick="window.location.reload()" style="padding:10px 18px;background:#334155;color:white;border:none;border-radius:8px;font-size:13px;font-weight:bold;cursor:pointer;">Normal Reload</button>' +
          '</div></div></div>';
      }
      window.renderFatalError = renderFatalError;

      window.addEventListener('error', function(e) {
        var err = e.error || e.message;
        if (err) {
          window.__codesphere_init_error = err;
          renderFatalError(err);
        }
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason;
        if (reason) {
          window.__codesphere_init_error = reason;
          renderFatalError(reason);
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
