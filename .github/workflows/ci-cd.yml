name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Code Quality & Linting ───────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    name: Lint & Code Quality
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies (server)
        run: cd server && npm install

      - name: Install dependencies (client)
        run: cd client && npm install

      - name: Lint server code
        run: cd server && npm run lint || true

      - name: Lint client code
        run: cd client && npm run lint || true

  # ─── Unit & Integration Tests ─────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    name: Tests
    needs: lint
    services:
      mongodb:
        image: mongo:6
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies (server)
        run: cd server && npm install

      - name: Create .env.test file
        run: |
          cd server
          cat > .env.test << EOF
          NODE_ENV=test
          MONGO_URI_TEST=mongodb://localhost:27017/codesphere-test
          JWT_SECRET=test-secret
          JUDGE0_API_KEY=test-key
          EOF

      - name: Run server tests
        run: cd server && npm test -- --coverage
        env:
          MONGO_URI_TEST: mongodb://localhost:27017/codesphere-test

      - name: Upload test coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./server/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  # ─── Build ────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    name: Build
    needs: test
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Build client
        run: cd client && npm install && npm run build

      - name: Build server (TypeScript check)
        run: cd server && npm install

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: builds
          path: |
            client/build
            server/
          retention-days: 30

  # ─── Docker Build & Push ──────────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    name: Docker Build & Push
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Docker image (server)
        uses: docker/build-push-action@v4
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}-server
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image (client)
        uses: docker/build-push-action@v4
        with:
          context: ./client
          push: true
          tags: ${{ steps.meta.outputs.tags }}-client
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Security Scanning ────────────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    name: Security Scanning
    needs: lint

    steps:
      - uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ─── Deploy to Staging ────────────────────────────────────────────────────
  deploy-staging:
    runs-on: ubuntu-latest
    name: Deploy to Staging
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - uses: actions/checkout@v3

      - name: Deploy to staging server
        run: |
          echo "Deploying to staging..."
          # Add your deployment script here
          # Example: ssh user@staging-server "cd /app && docker pull ... && docker-compose up -d"

  # ─── Notification ────────────────────────────────────────────────────────
  notify:
    runs-on: ubuntu-latest
    name: Notify
    needs: [lint, test, build]
    if: always()

    steps:
      - name: Send notification
        if: failure()
        run: |
          echo "Pipeline failed!"
          # Add notification logic here (Slack, Discord, etc)
