version: '3.8'

services:
  rocketchat:
    image: registry.rocket.chat/rocketchat/rocket.chat:latest
    container_name: codesphere-rocketchat
    restart: always
    ports:
      - "3000:3000"
    environment:
      - ROOT_URL=http://localhost:3000
      - PORT=3000
      - MONGO_URL=mongodb://rocketchat-db:27017/rocketchat?replicaSet=rs0
      - MONGO_OPLOG_URL=mongodb://rocketchat-db:27017/local?replicaSet=rs0
      - OVERWRITE_SETTING_Iframe_Restrict_Access=false
      - OVERWRITE_SETTING_Iframe_X_Frame_Options=*
      - DISABLE_X_FRAME=true
    depends_on:
      rocketchat-db:
        condition: service_healthy

  rocketchat-db:
    image: mongo:8.0
    container_name: codesphere-rocketchat-db
    restart: always
    volumes:
      - rocketchat_mongodb_data:/data/db
    command: mongod --oplogSize 128 --replSet rs0
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'try { rs.status() } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"rocketchat-db:27017\"}]}) }'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rocketchat_mongodb_data:
