version: '3.8'

services:
  rocketchat:
    image: registry.rocket.chat/rocketchat/rocket.chat:latest
    container_name: codesphere-rocketchat
    restart: always
    ports:
      - "3000:3000"
    environment:
      - ROOT_URL=http://localhost:3000
      - PORT=3000
      - MONGO_URL=mongodb://rocketchat-db:27017/rocketchat?replicaSet=rs0
      - MONGO_OPLOG_URL=mongodb://rocketchat-db:27017/local?replicaSet=rs0
    depends_on:
      rocketchat-db:
        condition: service_healthy

  rocketchat-db:
    image: docker.io/bitnami/mongodb:6.0
    container_name: codesphere-rocketchat-db
    restart: always
    volumes:
      - rocketchat_mongodb_data:/bitnami/mongodb
    environment:
      - MONGODB_REPLICA_SET_MODE=primary
      - MONGODB_REPLICA_SET_NAME=rs0
      - MONGODB_PORT_NUMBER=27017
      - ALLOW_EMPTY_PASSWORD=yes
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "rs.status().ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rocketchat_mongodb_data:
